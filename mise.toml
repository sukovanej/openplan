[tasks.lint]
description = "Check the task store's .plan/ files with the oplan linter"
run = "cargo run --quiet -p op-cli -- lint"

[tasks.rebuild]
description = "Rebuild the web SPA and restart the daemon with the fresh embed"
run = [
  "pnpm -C web -r build",
  "cargo run -p op-cli -- server restart",
]

[tasks.generate-web-client]
description = "Regenerate the Effect HTTP client (web/packages/api-client) from the Rust API's OpenAPI spec"
dir = "web/packages/api-client"
run = [
  "cargo run --quiet --manifest-path ../../../Cargo.toml -p op-cli -- server openapi > openapi.json",
  "pnpm exec openapigen -s openapi.json -f httpclient -n TasksClient > src/index.ts",
  "pnpm exec oxfmt src/index.ts",
]
