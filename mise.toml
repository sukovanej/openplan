[tasks.lint]
description = "Check the task store's .plan/ files with the openplan linter"
run = "cargo run --quiet -p op-cli -- lint"

# The daemon respawns itself from its own executable, so whichever binary runs `server restart`
# becomes the machine daemon. Restarting through `cargo run` would leave a `target/debug` build
# serving every read — one the next `cargo build` rewrites and `cargo clean` removes, both
# underneath the running process. This names the installed binary for that reason, and the SPA is
# built first so the binary it installs embeds a current one.
[tasks.install]
description = "Build the web SPA into the release binary, put it on PATH, and restart the daemon on it"
alias = "rebuild"
run = [
  "pnpm -C web -r build",
  "cargo install --path crates/op-cli --force",
  "openplan server restart",
]

[tasks.generate-web-client]
description = "Regenerate the Effect HTTP client (web/packages/api-client) from the Rust API's OpenAPI spec"
dir = "web/packages/api-client"
run = [
  "cargo run --quiet --manifest-path ../../../Cargo.toml -p op-cli -- server openapi > openapi.json",
  # `pnpm exec` prints a workspace banner on stdout, which the redirect would write into the file.
  "pnpm --silent exec openapigen -s openapi.json -f httpclient -n TasksClient > src/index.ts",
  "pnpm exec oxfmt src/index.ts",
]

[tasks.gui]
description = "Build the SPA into the daemon, restart it, and open the desktop window on it"
depends = ["install"]
run = "cargo run -p openplan-gui"

[tasks.icons]
description = "Rasterize assets/icon.svg into the desktop app icons and the web favicons"
tools = { resvg = "latest" }
run = """
set -eu
svg=assets/icon.svg
gui=crates/op-gui/icons
web=web/packages/app/public
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT

for size in 16 32 64 128 180 256 512 1024; do
  resvg --width "$size" --height "$size" "$svg" "$tmp/$size.png"
done

mkdir -p "$gui" "$web"
cp "$tmp/32.png" "$gui/32x32.png"
cp "$tmp/128.png" "$gui/128x128.png"
cp "$tmp/256.png" "$gui/128x128@2x.png"
cp "$tmp/1024.png" "$gui/icon.png"
cp "$svg" "$web/icon.svg"
cp "$tmp/32.png" "$web/favicon.png"
cp "$tmp/180.png" "$web/apple-touch-icon.png"

# Only macOS carries iconutil, and only macOS bundles the .app the .icns goes into, so a Linux
# machine keeps the committed one instead of failing the task.
if command -v iconutil >/dev/null 2>&1; then
  set=$tmp/icon.iconset
  mkdir -p "$set"
  cp "$tmp/16.png" "$set/icon_16x16.png"
  cp "$tmp/32.png" "$set/icon_16x16@2x.png"
  cp "$tmp/32.png" "$set/icon_32x32.png"
  cp "$tmp/64.png" "$set/icon_32x32@2x.png"
  cp "$tmp/128.png" "$set/icon_128x128.png"
  cp "$tmp/256.png" "$set/icon_128x128@2x.png"
  cp "$tmp/256.png" "$set/icon_256x256.png"
  cp "$tmp/512.png" "$set/icon_256x256@2x.png"
  cp "$tmp/512.png" "$set/icon_512x512.png"
  cp "$tmp/1024.png" "$set/icon_512x512@2x.png"
  iconutil -c icns "$set" -o "$gui/icon.icns"
else
  echo "no iconutil on this machine; $gui/icon.icns keeps its committed content" >&2
fi
"""
