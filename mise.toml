[tasks.lint]
description = "Check the task store's .plan/ files with the openplan linter"
run = "cargo run --quiet -p op-cli -- lint"

# The daemon respawns itself from its own executable, so whichever binary runs `server restart`
# becomes the machine daemon. Restarting through `cargo run` would leave a `target/debug` build
# serving every read — one the next `cargo build` rewrites and `cargo clean` removes, both
# underneath the running process. This names the installed binary for that reason, and the SPA is
# built first so the binary it installs embeds a current one.
[tasks.install]
description = "Build the web SPA into the release binary, put it on PATH, and restart the daemon on it"
alias = "rebuild"
run = [
  "pnpm -C web -r build",
  "cargo install --path crates/op-cli --force",
  "openplan server restart",
]

[tasks.generate-web-client]
description = "Regenerate the Effect HTTP client (web/packages/api-client) from the Rust API's OpenAPI spec"
dir = "web/packages/api-client"
run = [
  "cargo run --quiet --manifest-path ../../../Cargo.toml -p op-cli -- server openapi > openapi.json",
  # `pnpm exec` prints a workspace banner on stdout, which the redirect would write into the file.
  "pnpm --silent exec openapigen -s openapi.json -f httpclient -n TasksClient > src/index.ts",
  "pnpm exec oxfmt src/index.ts",
]
