name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
        if: ${{ !cancelled() }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      # `op-server` embeds `web/packages/app/dist` at compile time, so the SPA builds first.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm -r build
        working-directory: web
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
        if: ${{ !cancelled() }}
      - run: cargo fmt --check
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}

  lint-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # `op-server` embeds the SPA from this folder at compile time, and it is a gitignored build
      # output, so `openplan` does not link without it. The linter serves no assets and needs no
      # frontend toolchain — only the folder present.
      - run: mkdir -p web/packages/app/dist
      - run: cargo run --quiet -p openplan -- lint
