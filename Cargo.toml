[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/milansuk/open-planner"

[workspace.dependencies]
op-claude = { path = "crates/op-claude" }
op-md = { path = "crates/op-md" }
op-task = { path = "crates/op-task" }
op-store = { path = "crates/op-store" }
op-lint = { path = "crates/op-lint" }
op-git = { path = "crates/op-git" }
op-api = { path = "crates/op-api" }
op-client = { path = "crates/op-client" }
op-watch = { path = "crates/op-watch" }
op-index = { path = "crates/op-index" }
op-presence = { path = "crates/op-presence" }
op-server = { path = "crates/op-server" }
op-skills = { path = "crates/op-skills" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

pulldown-cmark = { version = "0.13", default-features = false }

gix = "0.85" # default features provide the sha1 object hash
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] } # UTC only, so no tzdb

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = "8"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

notify = "8"
fs2 = "0.4"
nix = { version = "0.31", features = ["signal", "process"] }
getrandom = "0.3"

clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] } # http only, no TLS

tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
