[package]
name = "openplan-gui"
description = "A desktop window on the openplan daemon's web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A Tauri app ships as a bundle, not as a binary in a tarball: a bare `openplan-gui` has no
# `.app`, no icon, and no declared WebKitGTK. `release-app.yml` builds and uploads it (OPP-100).
[package.metadata.dist]
dist = false

[[bin]]
name = "openplan-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
op-daemon.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true

[lints]
workspace = true
