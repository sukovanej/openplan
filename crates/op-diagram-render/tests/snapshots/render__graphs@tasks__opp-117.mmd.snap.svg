<svg xmlns="http://www.w3.org/2000/svg" class="op-diagram" viewBox="0 0 1188.89 216" width="1188.89" height="216" font-family="Inter Diagram, sans-serif" text-rendering="geometricPrecision"><style>.op-diagram { background: #fff; font-family: "Inter Diagram", Inter, "Helvetica Neue", Arial, sans-serif; }
