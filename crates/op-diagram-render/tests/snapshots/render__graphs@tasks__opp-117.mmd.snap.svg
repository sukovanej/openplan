.op-diagram .edge-label-box { fill: #fff; }
.op-diagram text { fill: #1f2430; }
.op-diagram .text-caption { fill: #6b7280; }
.op-diagram .text-header { fill: #454c5c; paint-order: stroke; stroke: #f7f8fb; stroke-width: 5px; stroke-linejoin: round; }
.op-diagram .text-edge-label { fill: #3a4150; }
