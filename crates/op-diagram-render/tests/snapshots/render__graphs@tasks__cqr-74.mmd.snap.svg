.op-diagram .divider { stroke: #9aa2b1; stroke-width: 1; stroke-dasharray: 5 4; }
.op-diagram .block .cluster-box { fill: none; stroke: #9aa2b1; }
.op-diagram .activation .outline { fill: #e6e9f2; stroke: #7b8599; }
.op-diagram .note .outline { fill: #fdf6d8; stroke: #cbb971; }
.op-diagram .note .outline-detail { stroke: #cbb971; }
.op-diagram .sequence-number .outline { fill: #5f6776; stroke: none; }
.op-diagram .text-number { fill: #fff; }
.op-diagram .actor-figure { fill: none; stroke: #7b8599; stroke-width: 1.4; }
.op-diagram .icon { color: #6b7280; }
.op-diagram .status-backlog, .op-diagram .status-cancelled { --status: oklch(0.551 0.027 264.364); }
.op-diagram .status-todo { --status: oklch(0.546 0.245 262.881); }
.op-diagram .status-in-progress { --status: oklch(0.666 0.179 58.318); }
.op-diagram .status-in-review, .op-diagram .status-unreadable { --status: oklch(0.637 0.237 25.331); }
.op-diagram .status-done { --status: oklch(0.596 0.145 163.225); }
.op-diagram .node[class*="status-"] .outline { stroke: var(--status); fill: color-mix(in srgb, var(--status) 12%, #fff); }
.op-diagram .cluster[class*="status-"] .cluster-box { stroke: var(--status); fill: color-mix(in srgb, var(--status) 6%, #fff); }
.op-diagram [class*="status-"] .icon { color: var(--status); }
.op-diagram .unresolved .outline { fill: #fff; stroke: #9aa2b1; stroke-dasharray: 4 3; }
