<svg xmlns="http://www.w3.org/2000/svg" class="op-diagram" viewBox="0 0 731.98 400" width="731.98" height="400" font-family="Inter Diagram, sans-serif" text-rendering="geometricPrecision"><style>.op-diagram { background: #fff; font-family: "Inter Diagram", Inter, "Helvetica Neue", Arial, sans-serif; }
.op-diagram .outline { fill: #f3f5fa; stroke: #7b8599; stroke-width: 1.2; }
.op-diagram .outline-detail { fill: none; stroke: #7b8599; stroke-width: 1.2; }
.op-diagram .cluster-box { fill: #f7f8fb; stroke: #b3bacb; stroke-width: 1; }
