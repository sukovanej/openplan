-size="14" font-weight="400" text-anchor="middle">Done</text></g><g class="edge-label"><rect class="edge-label-box" x="360.5" y="17.6" width="28.08" height="21" rx="3"/><text class="text-edge-label" x="374.54" y="32.47" font-size="12" font-weight="400" text-anchor="middle">yes</text></g><g class="edge-label"><rect class="edge-label-box" x="363.39" y="83.85" width="22.3" height="21" rx="3"/><text class="text-edge-label" x="374.54" y="98.72" font-size="12" font-weight="400" text-anchor="middle">no</text></g><g class="edge-label"><rect class="edge-label-box" x="221.54" y="166.27" width="34.7" height="21" rx="3"/><text class="text-edge-label" x="238.89" y="181.13" font-size="12" font-weight="400" text-anchor="middle">retry</text></g></svg>