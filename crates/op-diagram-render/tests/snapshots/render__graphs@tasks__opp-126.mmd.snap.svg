="middle">binary, restart</text></g><g class="node shape-rectangle"><rect class="outline" x="610.52" y="197.5" width="238.78" height="40" rx="3"/><text class="text-label" x="729.91" y="222.59" font-size="14" font-weight="400" text-anchor="middle">OPENPLAN_HOME/update.json</text></g><g class="edge-label"><rect class="edge-label-box" x="256.67" y="107.34" width="42.39" height="21" rx="3"/><text class="text-edge-label" x="277.87" y="122.2" font-size="12" font-weight="400" text-anchor="middle">check</text></g><g class="edge-label"><rect class="edge-label-box" x="463.56" y="17.5" width="95.98" height="21" rx="3"/><text class="text-edge-label" x="511.55" y="32.37" font-size="12" font-weight="400" text-anchor="middle">latest or canary</text></g><g class="edge-label"><rect class="edge-label-box" x="462.35" y="107.5" width="98.41" height="21" rx="3"/><text class="text-edge-label" x="511.55" y="122.37" font-size="12" font-weight="400" text-anchor="middle">a newer release</text></g><g class="edge-label"><rect class="edge-label-box" x="440.59" y="207" width="141.92" height="21" rx="3"/><text class="text-edge-label" x="511.55" y="221.87" font-size="12" font-weight="400" text-anchor="middle">last check and its result</text></g></svg>