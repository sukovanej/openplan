<rect class="outline" x="283.43" y="8" width="75.55" height="40" rx="3"/><text class="text-label" x="321.2" y="33.09" font-size="14" font-weight="400" text-anchor="middle">Mladík</text></g><g class="node shape-rectangle participant"><rect class="outline" x="283.43" y="526" width="75.55" height="40" rx="3"/><text class="text-label" x="321.2" y="551.09" font-size="14" font-weight="400" text-anchor="middle">Mladík</text></g><g class="edge-label"><rect class="edge-label-box" x="48" y="68" width="156.47" height="20" rx="3"/><text class="text-edge-label" x="126.23" y="82.73" font-size="13" font-weight="400" text-anchor="middle">Sama popíjí drink u baru</text></g><g class="edge-label"><rect class="edge-label-box" x="106.99" y="126" width="151.22" height="20" rx="3"/><text class="text-edge-label" x="182.6" y="140.73" font-size="13" font-weight="400" text-anchor="middle">„Nechceš společnost?“</text></g><g class="edge-label"><rect class="edge-label-box" x="61" y="164" width="243.2" height="38" rx="3"/><text class="text-edge-label" x="182.6" y="178.73" font-size="13" font-weight="400" text-anchor="middle">„Nemám zájem o společnost nějakého</text><text class="text-edge-label" x="182.6" y="196.73" font-size="13" font-weight="400" text-anchor="middle">blbečka.“</text></g><g class="edge-label"><rect class="edge-label-box" x="69.13" y="220" width="226.95" height="38" rx="3"/><text class="text-edge-label" x="182.6" y="234.73" font-size="13" font-weight="400" text-anchor="middle">„Já ale nejsem blbeček. Mám rating</text><text class="text-edge-label" x="182.6" y="252.73" font-size="13" font-weight="400" text-anchor="middle">2500 v Mudru.“</text></g><g class="edge-label"><rect class="edge-label-box" x="66.78" y="276" width="231.64" height="38" rx="3"/><text class="text-edge-label" x="182.6" y="290.73" font-size="13" font-weight="400" text-anchor="middle">„Cože? 2500? Vážně?! Takže víš, že</text><text class="text-edge-label" x="182.6" y="308.73" font-size="13" font-weight="400" text-anchor="middle">poločas rozpadu uranu-238 je…“</text></g><g class="edge-label"><rect class="edge-label-box" x="81.63" y="332" width="201.94" height="20" rx="3"/><text class="text-edge-label" x="182.6" y="346.73" font-size="13" font-weight="400" text-anchor="middle">„Ano. Přibližně 4,5 miliardy let.“</text></g><g class="edge-label"><rect class="edge-label-box" x="63.23" y="370" width="238.73" height="38" rx="3"/><text class="text-edge-label" x="182.6" y="384.73" font-size="13" font-weight="400" text-anchor="middle">„To ale ví kdekdo. A kdy byla bitva na</text><text class="text-edge-label" x="182.6" y="402.73" font-size="13" font-weight="400" text-anchor="middle">Bílé hoře?“</text></g><g class="edge-label"><rect class="edge-label-box" x="70.33" y="426" width="224.55" height="20" rx="3"/><text class="text-edge-label" x="182.6" y="440.73" font-size="13" font-weight="400" text-anchor="middle">„Samozřejmě — 8. listopadu 1620.“</text></g><g class="edge-label"><rect class="edge-label-box" x="98.89" y="464" width="167.42" height="38" rx="3"/><text class="text-edge-label" x="182.6" y="478.73" font-size="13" font-weight="400" text-anchor="middle">„Mohl bys mi prosím dělat</text><text class="text-edge-label" x="182.6" y="496.73" font-size="13" font-weight="400" text-anchor="middle">společnost?“</text></g></svg>