 367.52 887L367.52 887Q364.73 887 364.73 895L364.73 938"/><g class="head head-arrow"><path d="M364.73 946L360.23 937L369.23 937Z"/></g></g><g class="node shape-stadium"><rect class="outline" x="11.67" y="8" width="163.27" height="40" rx="20"/><text class="text-label" x="93.31" y="33.09" font-size="14" font-weight="400" text-anchor="middle">Edit from the API</text></g><g class="node shape-rectangle"><rect class="outline" x="8" y="104" width="170" height="40" rx="3"/><text class="text-label" x="93" y="129.09" font-size="14" font-weight="400" text-anchor="middle">Take the writing lock</text></g><g class="node shape-rectangle"><rect class="outline" x="10.65" y="200" width="164.5" height="60" rx="3"/><text class="text-label" x="92.9" y="225.09" font-size="14" font-weight="400" text-anchor="middle">Read the tip of</text><text class="text-label" x="92.9" y="245.09" font-size="14" font-weight="400" text-anchor="middle">refs/openplan/tasks</text></g><g class="node shape-rectangle"><rect class="outline" x="98.9" y="316" width="201.27" height="60" rx="3"/><text class="text-label" x="199.53" y="341.09" font-size="14" font-weight="400" text-anchor="middle">Run the write function</text><text class="text-label" x="199.53" y="361.09" font-size="14" font-weight="400" text-anchor="middle">on the snapshot of the tip</text></g><g class="node shape-rectangle"><rect class="outline" x="98.9" y="432" width="198.47" height="60" rx="3"/><text class="text-label" x="198.13" y="457.09" font-size="14" font-weight="400" text-anchor="middle">Write blobs, tree, commit</text><text class="text-label" x="198.13" y="477.09" font-size="14" font-weight="400" text-anchor="middle">parent = tip</text></g><g class="node shape-diamond"><path class="outline" d="M177.16 549.63A5 5 0 0 1 182.42 549.63L253.8 593.75A5 5 0 0 1 253.8 602.25L182.42 646.38A5 5 0 0 1 177.16 646.38L105.78 602.25A5 5 0 0 1 105.78 593.75Z"/><text class="text-label" x="179.79" y="593.09" font-size="14" font-weight="400" text-anchor="middle">Tree</text><text class="text-label" x="179.79" y="613.09" font-size="14" font-weight="400" text-anchor="middle">changed?</text></g><g class="node shape-stadium"><rect class="outline" x="98.9" y="777" width="123.78" height="40" rx="20"/><text class="text-label" x="160.79" y="802.09" font-size="14" font-weight="400" text-anchor="middle">No commit</text></g><g class="node shape-diamond"><path class="outline" d="M367.58 728.77A5 5 0 0 1 373.03 728.77L471.48 792.81A5 5 0 0 1 471.48 801.19L373.03 865.23A5 5 0 0 1 367.58 865.23L269.12 801.19A5 5 0 0 1 269.12 792.81Z"/><text class="text-label" x="370.3" y="782.09" font-size="14" font-weight="400" text-anchor="middle">Move the ref</text><text class="text-label" x="370.3" y="802.09" font-size="14" font-weight="400" text-anchor="middle">only if it still =</text><text class="text-label" x="370.3" y="822.09" font-size="14" font-weight="400" text-anchor="middle">tip</text></g><g class="node shape-rectangle"><rect class="outline" x="82.9" y="956" width="126.88" height="40" rx="3"/><text class="text-label" x="146.34" y="981.09" font-size="14" font-weight="400" text-anchor="middle">Sleep 1–20 ms</text></g><g class="node shape-stadium"><rect class="outline" x="249.77" y="946" width="229.92" height="60" rx="30"/><text class="text-label" x="364.73" y="971.09" font-size="14" font-weight="400" text-anchor="middle">HeadMoved, origin Local</text><text class="text-label" x="364.73" y="991.09" font-size="14" font-weight="400" text-anchor="middle">index reloads, sync in 2 s</text></g><g class="edge-label"><rect class="edge-label-box" x="149.64" y="678" width="22.3" height="21" rx="3"/><text class="text-edge-label" x="160.79" y="692.87" font-size="12" font-weight="400" text-anchor="middle">no</text></g><g class="edge-label"><rect class="edge-label-box" x="356.26" y="678" width="28.08" height="21" rx="3"/><text class="text-edge-label" x="370.3" y="692.87" font-size="12" font-weight="400" text-anchor="middle">yes</text></g><g class="edge-label"><rect class="edge-label-box" x="153.69" y="897" width="160.16" height="21" rx="3"/><text class="text-edge-label" x="233.76" y="911.87" font-size="12" font-weight="400" text-anchor="middle">moved by another process</text></g><g class="edge-label"><rect class="edge-label-box" x="353.84" y="897" width="21.78" height="21" rx="3"/><text class="text-edge-label" x="364.73" y="911.87" font-size="12" font-weight="400" text-anchor="middle">ok</text></g></svg>